<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Tracker — Privacy policy</title>
  <link rel="icon" href="icons/icon32.png" />
  <!-- Same tokens/primitives as the extension pages (repo root is the site root, so these resolve). -->
  <link rel="stylesheet" href="lib/tokens.css" />
  <link rel="stylesheet" href="lib/ui.css" />
  <style>
    body {
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.65;
      background: linear-gradient(180deg, var(--jt-primary-soft) 0%, transparent 320px), var(--jt-bg);
    }

    main { max-width: 52rem; margin: 0 auto; padding: 40px 20px 64px; }
    .jt-brand { margin-bottom: 20px; }

    article {
      background: var(--jt-card);
      border: 1px solid var(--jt-border);
      border-radius: var(--jt-radius-lg);
      padding: 32px 36px;
      box-shadow: var(--jt-shadow-sm);
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(1.6rem, 4vw, 2rem);
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .meta { margin: 0 0 24px; color: var(--jt-muted); font-size: 14px; }

    h2 {
      margin: 28px 0 8px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    p { margin: 0 0 12px; }
    ul { margin: 0 0 12px; padding-left: 1.25rem; }
    li { margin: 4px 0; }
    li::marker { color: var(--jt-primary-text); }

    .status { margin: 0; padding: 0; border: none; background: none; font-size: inherit; color: var(--jt-muted); }
    .status.error { color: var(--jt-danger-fg); }

    footer { margin-top: 24px; color: var(--jt-muted); font-size: 14px; }
    footer a { text-decoration: none; font-weight: 500; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      article { padding: 24px 18px; border-radius: 0; border-left: none; border-right: none; }
    }
  </style>
</head>
<body>
  <main>
    <a class="jt-brand" href="./">
      <img src="icons/logo.png" width="28" height="28" alt="" />
      <span class="jt-brand-name">Job Tracker</span>
    </a>
    <article id="policy">
      <p class="status">Loading privacy policy…</p>
    </article>
    <footer><a href="./">Job Tracker</a> · Chrome extension</footer>
  </main>
  <script>
    const SOURCE = 'store/LISTING_COPY.md';
    const DRAFT_HEADING = '### Privacy policy draft';

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function extractDraft(markdown) {
      const start = markdown.indexOf(DRAFT_HEADING);
      if (start === -1) throw new Error('Privacy policy draft heading not found in LISTING_COPY.md');

      const afterHeading = markdown.slice(start + DRAFT_HEADING.length);
      const fenceOpen = afterHeading.indexOf('```');
      if (fenceOpen === -1) throw new Error('Opening code fence not found');

      const afterOpen = afterHeading.slice(fenceOpen + 3).replace(/^[a-z]*\r?\n/, '');
      const fenceClose = afterOpen.indexOf('```');
      if (fenceClose === -1) throw new Error('Closing code fence not found');

      return afterOpen.slice(0, fenceClose).replace(/^\uFEFF/, '').trimEnd();
    }

    function draftToHtml(draft) {
      const lines = draft.replace(/\r\n/g, '\n').split('\n');
      if (!lines.length || !lines[0].trim()) throw new Error('Privacy policy draft is empty');

      const parts = [];
      parts.push('<h1>' + escapeHtml(lines[0].trim()) + '</h1>');

      let listItems = [];
      const flushList = () => {
        if (!listItems.length) return;
        parts.push('<ul>');
        for (const item of listItems) parts.push('<li>' + escapeHtml(item) + '</li>');
        parts.push('</ul>');
        listItems = [];
      };

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) {
          flushList();
          continue;
        }
        if (/^Last updated:/i.test(line)) {
          flushList();
          parts.push('<p class="meta">' + escapeHtml(line) + '</p>');
          continue;
        }
        const section = line.match(/^(\d+)\.\s+(.+)$/);
        if (section) {
          flushList();
          parts.push('<h2>' + escapeHtml(section[1] + '. ' + section[2]) + '</h2>');
          continue;
        }
        if (line.startsWith('•') || line.startsWith('- ')) {
          listItems.push(line.replace(/^[•\-]\s*/, ''));
          continue;
        }
        flushList();
        parts.push('<p>' + escapeHtml(line) + '</p>');
      }
      flushList();
      return parts.join('\n');
    }

    async function loadPolicy() {
      const root = document.getElementById('policy');
      try {
        const res = await fetch(SOURCE, { cache: 'no-cache' });
        if (!res.ok) throw new Error('Could not load ' + SOURCE + ' (' + res.status + ')');
        const markdown = await res.text();
        root.innerHTML = draftToHtml(extractDraft(markdown));
      } catch (err) {
        root.innerHTML =
          '<p class="status error">Could not load the privacy policy from LISTING_COPY.md.</p>' +
          '<p class="status error">' + escapeHtml(err.message || String(err)) + '</p>';
      }
    }

    loadPolicy();
  </script>
</body>
</html>
